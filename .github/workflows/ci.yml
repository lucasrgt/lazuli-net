name: CI

on:
  workflow_call:
    inputs:
      full:
        description: run the exhaustive release gate
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: run the exhaustive release gate
        required: false
        default: false
        type: boolean

# Four native engines, one front door: .NET, Node.js, React/TS, and Flutter each get a gate.
# Pull requests and pushes run the affected closure; release callers explicitly request full.
jobs:
  parity:
    name: cross-runtime parity manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: verify parity guard behavior
        run: npm run test:parity
      - name: reject unmapped or unilateral runtime drift
        run: npm run check:parity -- --ci

  dotnet:
    name: backend (skies gate)
    runs-on: ubuntu-latest
    env:
      SKY_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: affected verification
        if: ${{ !inputs.full }}
        run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- gate --affected --base "$SKY_CI_BASE" Skies.Framework.slnx -c Release
      - name: exhaustive release verification
        if: ${{ inputs.full }}
        run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- gate --full Skies.Framework.slnx -c Release

  frontend:
    name: frontend-sdk (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - run: npm ci
      - run: npm run check

  flutter:
    name: flutter-sdk (generator + analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: flutter-sdk/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: npm ci
      - run: npm run check

  node:
    name: node-sdk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: PostgreSQL Testcontainers integration proof
        if: runner.os == 'Linux'
        run: npm run test:integration
      - name: pilot affected proof gate
        if: ${{ runner.os == 'Linux' && !inputs.full }}
        run: npm run gate:affected --workspace @skiesjs/pilot-api
      - name: pilot exhaustive release gate
        if: ${{ runner.os == 'Linux' && inputs.full }}
        run: npm run gate:full --workspace @skiesjs/pilot-api
      - name: upload pilot proof receipts
        if: ${{ runner.os == 'Linux' && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: node-pilot-proof-receipts
          path: |
            node-sdk/examples/pilot-api/.skies/foundation/*.json
            node-sdk/examples/pilot-api/VERIFICATION.*
          if-no-files-found: warn
      - run: npm run package-smoke
      - name: pilot mutation calibration
        if: runner.os == 'Linux'
        run: npm run mutate --workspace @skiesjs/pilot-api
