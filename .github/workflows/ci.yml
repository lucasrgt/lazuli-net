name: CI

on:
  workflow_call:
    inputs:
      full:
        description: run the exhaustive release gate
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: run the exhaustive release gate
        required: false
        default: false
        type: boolean

# Two native engines, one front door (per frontend/README): the .NET backend slice and the React/TS frontend
# slice each get a gate. Pull requests and pushes run the affected closure; release callers explicitly request full.
jobs:
  dotnet:
    name: backend (skies gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: affected verification
        if: ${{ !inputs.full }}
        run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- gate --affected Skies.Framework.slnx -c Release
      - name: exhaustive release verification
        if: ${{ inputs.full }}
        run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- gate --full Skies.Framework.slnx -c Release

  frontend:
    name: frontend-sdk (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - run: npm ci
      - run: npm run check
