name: publish

# Publishes the Skies framework — all engines off ONE version tag (e.g. `v1.0.0`): the .NET backend to
# nuget.org and the React frontend plus Node.js backend packages to npm. Bump each changed package version first,
# then tag.
# Auth: NuGet prefers Trusted Publishing and falls back to the repository's scoped NUGET_API_KEY when an
# external trust policy is unavailable; npm uses NPM_TOKEN. The ecosystem jobs are independent — one
# failing does not block the others. The nuget set below is
# the public framework surface: SelfHarness (framework-dev only), Geocoding (not yet on the library standard),
# and the sample/tests are deliberately excluded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  quality:
    name: exact CI quality gate
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # Release guard: no publishable unit may ship new content under a version that is already out — fail the whole
  # release so the fix is a version bump, not a silent skip (the "0.x published != 0.x canonical" drift). Both
  # ecosystem jobs wait on it; they stay independent of each other.
  guard:
    name: release guard (versions bumped since last release)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so the guard can diff HEAD against the previous release
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - name: install release-guard dependencies
        working-directory: frontend-sdk
        run: npm ci
      - run: node frontend-sdk/tools/release-guard.mjs

  nuget:
    name: pack + push to nuget.org
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for nuget.org Trusted Publishing
      contents: read # checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: pack
        run: |
          for proj in \
            src/Skies/Skies.Framework.csproj \
            src/Skies.Framework.Abstractions/Skies.Framework.Abstractions.csproj \
            src/Skies.Framework.AspNetCore/Skies.Framework.AspNetCore.csproj \
            src/Skies.Framework.Auth/Skies.Framework.Auth.csproj \
            src/Skies.Framework.EntityFrameworkCore/Skies.Framework.EntityFrameworkCore.csproj \
            src/Skies.Framework.Identity/Skies.Framework.Identity.csproj \
            src/Skies.Framework.Mail/Skies.Framework.Mail.csproj \
            src/Skies.Framework.Sms/Skies.Framework.Sms.csproj \
            src/Skies.Framework.Storage/Skies.Framework.Storage.csproj \
            src/Skies.Framework.Testing/Skies.Framework.Testing.csproj \
            src/Skies.Framework.Testing.InMemory/Skies.Framework.Testing.InMemory.csproj \
            src/Skies.Framework.Testing.Postgres/Skies.Framework.Testing.Postgres.csproj \
            src/Skies.Framework.Cli/Skies.Framework.Cli.csproj \
            analyzers/Skies.Framework.Doctor/Skies.Framework.Doctor.csproj ; do
            dotnet pack "$proj" -c Release -o nupkgs
          done
      # Prefer a short-lived NuGet key obtained through OIDC. A repository rename can temporarily invalidate
      # the external trust policy, so the push step falls back to the existing scoped repository secret.
      - name: nuget login (OIDC → temp key)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: lucasrgt
      - name: push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "Neither NuGet Trusted Publishing nor NUGET_API_KEY is available."
            exit 1
          fi
          dotnet nuget push "nupkgs/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    name: publish frontend packages to npm
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: frontend-sdk/package-lock.json
      - name: install
        working-directory: frontend-sdk
        run: npm ci
      # Auto-discover the publishable workspace packages: skip the private root members and any version already
      # on npm (the npm equivalent of nuget's --skip-duplicate). Flipping a package's `private` off enrolls it
      # here automatically — one tag stays the single release lever as the surface grows (eslint-plugin, assay…).
      - name: publish public packages (skip versions already on npm)
        working-directory: frontend-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (the nuget leg is independent and still ran)."
            exit 0
          fi
          for dir in . packages/*/; do
            name=$(node -p "try{require('./$dir/package.json').name||''}catch(e){''}")
            [ -z "$name" ] && continue
            private=$(node -p "try{!!require('./$dir/package.json').private}catch(e){true}")
            [ "$private" = "true" ] && { echo "skip $name (private)"; continue; }
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already on npm — skip"
            else
              echo "publishing $name@$ver"
              ( cd "$dir" && npm publish )
            fi
          done

  node-npm:
    name: publish Node.js packages to npm
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestations
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: node-sdk/package-lock.json
      - name: install and build
        working-directory: node-sdk
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run build
      - name: publish public packages in dependency order
        working-directory: node-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — Node.js packages cannot be published."
            exit 1
          fi
          for dir in packages/core packages/openapi packages/express packages/auth packages/auth-express packages/socketio packages/identity packages/mail packages/sms packages/storage packages/storage-express packages/rate-limit-express packages/drizzle-postgres packages/testing packages/testing-postgres packages/doctor packages/eslint-plugin-skies-node packages/foundation packages/framework packages/cli; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already on npm — skip"
            else
              echo "publishing $name@$ver"
              ( cd "$dir" && npm publish --access public --provenance )
            fi
          done
      - name: verify exact published packages from the registry
        working-directory: node-sdk
        run: |
          receipt="$RUNNER_TEMP/skies-node-publish-receipt"
          rm -rf "$receipt"
          mkdir -p "$receipt"
          cd "$receipt"
          npm init -y >/dev/null
          specs=""
          for dir in $GITHUB_WORKSPACE/node-sdk/packages/{core,openapi,express,auth,auth-express,socketio,identity,mail,sms,storage,storage-express,rate-limit-express,drizzle-postgres,testing,testing-postgres,doctor,eslint-plugin-skies-node,foundation,framework,cli}; do
            name=$(node -p "require('$dir/package.json').name")
            ver=$(node -p "require('$dir/package.json').version")
            specs="$specs $name@$ver"
          done
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if npm install --ignore-scripts --no-audit --no-fund --save-exact $specs; then
              installed=true
              break
            fi
            rm -rf node_modules package-lock.json
            sleep 10
          done
          [ "$installed" = "true" ] || { echo "registry packages did not become consumable"; exit 1; }
          node --input-type=module -e 'await Promise.all([
            "@skiesjs/core", "@skiesjs/openapi", "@skiesjs/express", "@skiesjs/auth",
            "@skiesjs/auth-express", "@skiesjs/socketio", "@skiesjs/identity", "@skiesjs/mail", "@skiesjs/sms",
            "@skiesjs/storage", "@skiesjs/storage-express", "@skiesjs/rate-limit-express",
            "@skiesjs/drizzle-postgres", "@skiesjs/testing", "@skiesjs/testing-postgres",
            "@skiesjs/doctor", "@skiesjs/foundation", "eslint-plugin-skies-node", "@skiesjs/cli",
          ].map((name) => import(name)))'
          npx --no-install skies-node --help
          npx --no-install skies-node-doctor --help
          npm ls --all --json > npm-receipt.json
      - uses: actions/upload-artifact@v6
        with:
          name: skies-node-publish-receipt
          path: ${{ runner.temp }}/skies-node-publish-receipt/npm-receipt.json
          if-no-files-found: error
