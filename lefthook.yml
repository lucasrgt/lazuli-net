# Git hooks via lefthook — one config across the framework (.NET via Skies.Framework.slnx + the frontend-sdk workspace). The
# doctor runs locally before code is shared. pre-commit runs the SKYFE plugin self-test when SDK files change;
# pre-push runs the backend doctor (the SKY*/SKYSELF* analyzers in the build) and the SDK typecheck. Glob-gated so a
# backend-only change skips the SDK checks and vice versa. Wired by `npx lefthook install` via the `prepare` script.
pre-commit:
  commands:
    foundation-check:
      run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- check --task "pre-commit review" --staged --fast

pre-push:
  commands:
    foundation-check:
      run: dotnet run --project src/Skies.Framework.Cli/Skies.Framework.Cli.csproj -c Release -- check --task "pre-push review" --base origin/main --fast
