title = "Lefthook dropped arguments after a double-quoted task"
lesson = "Use shell single quotes for multi-word task values in Lefthook run commands; on Windows, Lefthook wraps the command in double quotes and nested double quotes can cause trailing scope flags to be lost before Skies parses them."
