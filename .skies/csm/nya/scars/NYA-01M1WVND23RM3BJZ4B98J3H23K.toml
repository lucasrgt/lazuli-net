title = "Node fast fallback dropped direct proofs and ran full on missing Git"
lesson = "A scoped gate must fail without executing lanes when Git discovery is unavailable, regardless of fast mode. Deferring a force-full scope must preserve proofs directly mapped to the same changed path and their dependency closure."
