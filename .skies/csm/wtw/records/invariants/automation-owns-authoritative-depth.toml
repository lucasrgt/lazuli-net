schema = 1
id = "automation-owns-authoritative-depth"
kind = "invariant"
status = "active"
title = "Automation owns authoritative verification depth"
statement = "Pull-request CI runs authoritative affected verification without `--fast`, and release automation runs exhaustive verification with `--full`."
violation = "A pull-request workflow uses `--fast` as its authoritative verdict, a release boundary lacks `--full`, or local agent verification replaces either automation-owned gate."
scopes = [
    "**/.github/workflows/*.yaml",
    "**/.github/workflows/*.yml",
    "src/Skies.Framework.Cli/SkiesManifest.cs",
    "templates/skies-app/.github/workflows/*.yaml",
    "templates/skies-app/.github/workflows/*.yml",
]
evidence = [
    """
Pull-request CI owns authoritative affected verification and runs without `--fast`. Release automation owns
`skies check --task "<release>" --full`.""",
    """
These automation-owned depth gates are validated by `skies doctor`, so an agent cannot silently replace them with
the faster local modes.""",
]
