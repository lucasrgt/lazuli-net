id = "pre-push-mode-matches-authority"
kind = "invariant"
status = "active"
title = "Pre-push verification matches the selected authority"
statement = "With CI authority, the pre-push hook is base-relative and fast; with local authority, it is base-relative and authoritative without `--fast`."
violation = "The pre-push hook is not base-relative, or its fast versus authoritative mode does not match the repository's selected authority."
scopes = ["**/*"]
evidence = [
    "When pull-request CI owns authority, the pre-push hook is base-relative and fast. When the local machine owns",
    "authority, the pre-push hook is base-relative and authoritative, without `--fast`.",
]
