schema = 1
id = "explicit-verification-authority-boundary"
kind = "decision"
status = "active"
title = "Choose an explicit local or CI verification authority"
statement = "Repositories must use explicitly scoped local Skies checks and choose exactly one checked authority boundary—pull-request CI or the local pre-push hook—for authoritative affected verification without `--fast`; they must also expose an explicit `--full` release command."
rationale = "Explicit bounded feedback keeps local iteration fast while checked commands preserve authoritative affected and exhaustive verification. Allowing local authority avoids redundant CI cost when a repository has no distinct remote merge trust boundary."
scopes = ["**/*"]
evidence = [
    'Both modes expose `skies check --task "<release>" --full` through an explicit release command.',
    "Local Skies checks require an explicit scope.",
]
recorded_at = "2026-08-12T04:15:20.569908700Z"
recorded_by = "Lucas Tinoco"
recorded_commit = "01591235e97ea970168b07345f5602d557b7f548"

[[alternatives]]
statement = "Make every local check exhaustive."
rejected_because = "Its cost scales with the whole repository and makes frequent verification impractical."

[[alternatives]]
statement = "Only recommend `--staged --fast` in agent instructions."
rejected_because = "An agent can omit a recommended command and never run affected or full verification."

[[alternatives]]
statement = "Make fast mode silently drop directly mapped proofs."
rejected_because = "Bounded feedback must still execute every proof that the impact graph maps exactly."

[[alternatives]]
statement = "Require pull-request CI in every repository."
rejected_because = "A locally delivered repository has no remote merge boundary and would pay the same verification cost twice."

