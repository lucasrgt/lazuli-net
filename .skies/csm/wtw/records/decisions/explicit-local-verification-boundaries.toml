schema = 1
id = "explicit-local-verification-boundaries"
kind = "decision"
status = "superseded"
title = "Explicit local verification boundaries"
statement = "Local Skies checks require an explicit scope: pre-commit verification uses bounded `--staged`, pre-push verification uses base-relative `--fast`, pull-request CI owns authoritative affected verification, and release automation owns `--full`."
rationale = "Unscoped local checks could widen a small change into the repository's complete backend and browser inventory, making frequent verification impractical; bounded local feedback preserves iteration speed while checked hooks and CI guarantee authoritative depth at the appropriate lifecycle boundaries."
scopes = [
    "**/.github/workflows/*.yaml",
    "**/.github/workflows/*.yml",
    "**/AGENTS.md",
    "**/CLAUDE.md",
    "**/lefthook.yml",
    "src/Skies.Framework.Cli/**/*.cs",
    "templates/skies-app/**/*",
]
evidence = [
    "**Status:** accepted and implemented.",
    """
Pull-request CI owns authoritative affected verification and runs without `--fast`. Release automation owns
`skies check --task "<release>" --full`. Bare `skies check --task ...` is invalid and exits before any gate starts.""",
]
recorded_at = "2026-07-30T20:00:46.591019200Z"
recorded_by = "Lucas Tinoco"
recorded_commit = "4f052f964f6c0b3504f6627fdc973840ef978688"

[[alternatives]]
statement = "Make every local check exhaustive."
rejected_because = "Its cost scales with the whole repository rather than the change and makes frequent verification impractical."

[[alternatives]]
statement = "Merely recommend `--staged --fast` in agent instructions."
rejected_because = "An agent can omit a recommended command and never run affected or full verification."

[[alternatives]]
statement = "Let fast mode silently drop directly mapped proofs."
rejected_because = "Bounded feedback must still execute every proof that the impact graph can map exactly."

[authority]
kind = "adr"
source = "docs/decisions/explicit-verification-boundaries.md"
quote = """
Local Skies checks require an explicit scope. Before commit, the primary agent stages the exact intended paths and
runs `skies check --task "<task>" --staged`; staged mode is always bounded. Before push, the agent and hook run
`skies check --task "<review>" --base <target-revision> --fast`."""

