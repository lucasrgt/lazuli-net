# Git hooks via lefthook. The index roots the fast commit check; commits being pushed root the complete affected
# proof closure. Gate-control edits are doctor-validated without widening application proofs. The CLI owns
# selection, so no feature annotation or caller-authored filter can weaken either.
pre-commit:
  commands:
    affected-fast:
      run: dotnet tool run af gate --staged --fast
    known-recurrences:
      run: dotnet tool run af nya check --task "pre-commit recurrence review"

pre-push:
  commands:
    affected-release:
      run: dotnet tool run af gate --affected --base origin/main --fast
    known-recurrences:
      run: dotnet tool run af nya check --base origin/main --task "pre-push recurrence review"
