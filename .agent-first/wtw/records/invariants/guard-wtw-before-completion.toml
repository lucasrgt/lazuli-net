id = "guard-wtw-before-completion"
kind = "invariant"
status = "active"
title = "Guard WTW before completion"
statement = "Every completed change runs `dotnet tool run af wtw guard`; graph-health failures and incomplete checks block completion, and tests or documentation cannot substitute for the guard."
violation = "A change is completed without a successful WTW guard, after guard exit code 1 or 2, or using tests or documentation as a substitute."
scopes = [
    "**/AGENTS.md",
    "**/CLAUDE.md",
    "**/GEMINI.md",
    "**/lefthook.yml",
    "aerofortress-plugin/skills/**",
    "templates/aerofortress-app/**",
]
evidence = [
    '+      run: dotnet tool run af wtw guard --base origin/main --task "pre-push governance review"',
    '+      run: dotnet tool run af wtw guard --task "pre-commit governance review"',
]
recorded_at = "2026-07-27T04:00:38.039102100Z"
recorded_by = "Lucas Tinoco"
recorded_commit = "e91425015330c1b55ed8cb24d0f1209ffacd10a6"

[authority]
kind = "policy"
source = "diff"
quote = """
5. Before completion, run `dotnet tool run af wtw guard --task "<completed task>"`. Exit code 1
+   means the governing graph is unhealthy and exit code 2 is an incomplete
+   check.
+
+Tests and documentation do not replace `dotnet tool run af wtw guard`."""
