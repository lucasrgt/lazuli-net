schema = 1
id = "primary-agent-foundation-orchestration"
kind = "decision"
status = "active"
title = "Primary agent owns foundation orchestration"
statement = "The primary coding agent must own the complete Skies foundation lifecycle by running one bounded context command before implementation and one comprehensive fail-closed check before completion, while foundation tools remain independent, versioned engines."
rationale = "A single orchestration surface bounds context, preserves each foundation's independent semantics, reduces duplicated coordination and token costs, and ensures every required final check runs deterministically and fails closed."
scopes = ["**/*"]
evidence = [
    "Before commit, pull request creation, push, or any completion claim, the same agent runs:",
    "Before implementation, the primary agent runs:",
]
recorded_at = "2026-07-27T17:33:32.472922400Z"
recorded_by = "Lucas Tinoco"
recorded_commit = "b3277a1595d6f68b235e8b364665427d72a5520f"

[[alternatives]]
statement = "Assign one permanent specialist agent to each of NYA, WTW, RTW, NWC, and AVP."
rejected_because = "Duplicated context and coordination costs would scale with the number of foundations."

[[alternatives]]
statement = "Merge the foundation engines into Skies."
rejected_because = "Each foundation tool must remain usable by other languages, frameworks, agents, and repositories."

[[alternatives]]
statement = "Rely only on prose instructions to enforce the workflow."
rejected_because = "Compaction and long tasks can remove or dilute prose instructions."

[authority]
kind = "adr"
source = "docs/decisions/primary-agent-foundation-orchestration.md"
quote = "The primary coding agent owns the complete Skies foundation lifecycle. It uses one bounded context command before work and one comprehensive check command before completion. The foundation tools remain independent, versioned engines underneath that workflow."

