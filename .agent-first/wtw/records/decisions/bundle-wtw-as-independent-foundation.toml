schema = 1
id = "bundle-wtw-as-independent-foundation"
kind = "decision"
status = "active"
title = "Bundle Why This Way as an independent foundation"
statement = "AeroFortress scaffolds and operates Why This Way as a default, independent fifth foundation alongside AVP, NYA, RTW, and NWC."
rationale = "WTW preserves governing decisions and invariants without merging its data or responsibilities with the other foundation protocols."
scopes = [
    "**/.agent-first/wtw/**",
    "**/AGENTS.md",
    "**/CLAUDE.md",
    "**/GEMINI.md",
    "**/lefthook.yml",
    "src/AeroFortress.Framework.Cli/**",
    "templates/aerofortress-app/**",
]
evidence = [
    '+    ["wtw", .. var rest] => WtwCommand.Run(rest),',
    "+  behavior, NYA prevents known failures, WTW preserves governing decisions and invariants, RTW preserves",
]
recorded_at = "2026-07-27T04:00:37.928559600Z"
recorded_by = "Lucas Tinoco"
recorded_commit = "e91425015330c1b55ed8cb24d0f1209ffacd10a6"

[[alternatives]]
statement = "Keep the foundation stack limited to AVP, NYA, RTW, and NWC."
rejected_because = "That stack has no dedicated versioned protocol for preserving governing decisions and invariants."

[[alternatives]]
statement = "Merge decision and invariant records into another foundation protocol."
rejected_because = "The framework explicitly composes independent tools instead of merging their data or responsibilities."

[authority]
kind = "merged_change"
source = "diff"
quote = """
The framework composes five independent tools instead of merging their data or
 responsibilities:"""

