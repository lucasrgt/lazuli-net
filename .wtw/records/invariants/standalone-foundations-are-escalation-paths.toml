title = "Standalone foundation commands are escalation paths"
statement = "Individual foundation commands may be used for deeper inspection, collection, or maintenance, but foundations must not be assigned separate permanent agent roles."
violation = "A permanent specialist agent is delegated to an individual foundation as part of the standard orchestration workflow."
